<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelería Digital - Aliado Tech</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primario: #0b3d91;
            --color-secundario: #e31837;
            --bg-oscuro: #0a0f1d;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-oscuro);
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        /* Efecto Flash cuando los datos se actualizan */
        @keyframes flash-update {
            0% { box-shadow: inset 0 0 0 0px rgba(241, 196, 15, 0); }
            10% { box-shadow: inset 0 0 0 20px rgba(241, 196, 15, 0.9); }
            100% { box-shadow: inset 0 0 0 0px rgba(241, 196, 15, 0); }
        }
        .actualizacion-flash {
            animation: flash-update 1.5s ease-out;
        }

        /* --- CABECERA --- */
        .header {
            background: linear-gradient(135deg, var(--color-primario), var(--color-secundario));
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            border-bottom: 4px solid rgba(255,255,255,0.2);
        }

        .agencia-info { display: flex; align-items: center; gap: 20px; }
        
        .logo-img { 
            height: 70px; max-width: 250px; object-fit: contain; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); 
            display: none; 
        }
        
        .nombre-agencia { 
            font-size: 2.5rem; font-weight: 900; text-transform: uppercase; 
            letter-spacing: 2px; margin: 0; color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        .reloj { font-size: 3.5rem; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        /* --- CONTENEDOR DE TARJETAS --- */
        .board-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        /* --- DISEÑO DE TARJETA --- */
        .ruta-card {
            background: #141c2c; 
            border-radius: 12px;
            border-left: 12px solid var(--color-secundario);
            padding: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            position: relative;
        }

        /* Título con Ícono de Autobús */
        .destino-container {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .bus-icon {
            width: 40px; height: 40px;
            fill: #ffffff;
            opacity: 0.8;
        }

        .destino { 
            font-size: 2.8rem; font-weight: 900; text-transform: uppercase; 
            margin: 0; line-height: 1; letter-spacing: -1px;
        }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .dato-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .dato-label { font-size: 0.9rem; color: #bdc3c7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; }
        .dato-valor { font-size: 2.2rem; font-weight: 900; color: #f1c40f; }
        .precio-valor { color: #2ecc71; }

        /* --- CHIPS DE ESTADO --- */
        .estado-contenedor { margin-top: 20px; }
        
        .chip-estado {
            display: block; padding: 12px; border-radius: 8px; font-size: 1.5rem;
            font-weight: 900; text-align: center; text-transform: uppercase;
            letter-spacing: 2px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .estado-atiempo { background-color: #27ae60; color: white; }
        .estado-demorado { background-color: #f39c12; color: black; }
        .estado-agotado { background-color: #7f8c8d; color: white; }
        
        /* Latido Verde para Embarcando */
        .estado-embarcando { 
            background-color: #2ecc71; 
            color: black; 
            animation: latido-verde 1.5s infinite;
        }

        @keyframes latido-verde {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="agencia-info">
            <img id="logo-agencia" class="logo-img" src="" alt="">
            <h1 id="nombre-agencia" class="nombre-agencia">Cargando...</h1>
        </div>
        <div id="reloj-local" class="reloj">00:00</div>
    </div>

    <div id="board-container" class="board-container">
        <!-- Tarjetas dinámicas -->
    </div>

    <script>
        // === 1. CONFIGURACIÓN ===
        // ¡PEGA AQUÍ TU ENLACE DE APPS SCRIPT!
        const API_URL = "https://script.google.com/macros/s/AKfycbwMMdszyfglMZRGyaybctYL3X6ekUDaTvGbBJJD-ZK3vWQWnFK65spELUrNhYiQTI2Zzg/exec"; 
        
        const params = new URLSearchParams(window.location.search);
        const agenciaFiltro = params.get('agencia') || 'civa'; 
        const pantallaFiltro = params.get('pantalla'); 

        // Variables para detectar cambios y reproducir sonido
        let datosAnteriores = "";
        // Audio de campanilla de aeropuerto (Aviso estándar gratuito de Google)
        const sonidoAlerta = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        // === 2. FUNCIÓN PRINCIPAL ===
        async function cargarDatos() {
            try {
                const respuesta = await fetch(`${API_URL}?agencia=${agenciaFiltro}`);
                const textoObtenido = await respuesta.text();
                const datos = JSON.parse(textoObtenido);
                
                if (datos.agencia) {
                    aplicarBranding(datos.agencia);
                    
                    // --- SISTEMA DE ALERTA DE ACTUALIZACIÓN ---
                    const rutasNuevasStr = JSON.stringify(datos.rutas);
                    if (datosAnteriores !== "" && datosAnteriores !== rutasNuevasStr) {
                        lanzarAlertaVisualYSonora(); // Si algo cambió, ¡alerta!
                    }
                    datosAnteriores = rutasNuevasStr; // Guardar estado actual
                    
                    renderizarRutas(datos.rutas);
                }
            } catch (error) {
                console.error("Error conectando a Sheets:", error);
            }
        }

        // Función para destello y sonido
        function lanzarAlertaVisualYSonora() {
            // Reproducir sonido (solo funciona si el usuario interactuó con la pantalla antes)
            sonidoAlerta.play().catch(e => console.log("Navegador bloqueó el autoplay del sonido"));
            
            // Destello amarillo en la pantalla
            document.body.classList.add('actualizacion-flash');
            setTimeout(() => {
                document.body.classList.remove('actualizacion-flash');
            }, 1500);
        }

        // === 3. APLICAR DISEÑO ===
        function aplicarBranding(agencia) {
            document.documentElement.style.setProperty('--color-primario', agencia.colorPrimario);
            document.documentElement.style.setProperty('--color-secundario', agencia.colorSecundario);
            
            const logoEl = document.getElementById('logo-agencia');
            const nombreEl = document.getElementById('nombre-agencia');

            if (agencia.logo && agencia.logo.trim() !== "") {
                logoEl.src = agencia.logo;
                logoEl.style.display = 'block';
                nombreEl.style.display = 'none';
            } else {
                logoEl.style.display = 'none';
                nombreEl.style.display = 'block';
                nombreEl.textContent = agencia.nombre;
            }
        }

        // === 4. DIBUJAR TARJETAS ===
        function renderizarRutas(rutas) {
            const contenedor = document.getElementById('board-container');
            contenedor.innerHTML = ''; 

            const rutasFiltradas = pantallaFiltro ? rutas.filter(r => r.asignacionPantalla == pantallaFiltro) : rutas;

            rutasFiltradas.forEach(ruta => {
                let claseEstado = 'estado-atiempo';
                let estadoTexto = (ruta.estadoBus || 'A TIEMPO').toUpperCase();
                
                if (estadoTexto.includes('EMBARCANDO')) claseEstado = 'estado-embarcando';
                else if (estadoTexto.includes('DEMORADO') || estadoTexto.includes('RETRASADO')) claseEstado = 'estado-demorado';
                else if (estadoTexto.includes('AGOTADO') || estadoTexto.includes('CANCELADO')) claseEstado = 'estado-agotado';

                // Se agregó el ícono SVG de un bus al lado del nombre de destino
                const cardHTML = `
                    <div class="ruta-card">
                        <div class="destino-container">
                            <svg class="bus-icon" viewBox="0 0 24 24">
                                <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                            </svg>
                            <h2 class="destino">${ruta.destino}</h2>
                        </div>
                        
                        <div class="info-grid">
                            <div class="dato-box">
                                <div class="dato-label">SALIDA</div>
                                <div class="dato-valor">⏱ ${ruta.hora}</div>
                            </div>
                            <div class="dato-box">
                                <div class="dato-label">TARIFA</div>
                                <div class="dato-valor precio-valor">S/ ${ruta.precio}</div>
                            </div>
                        </div>

                        <div class="estado-contenedor">
                            <span class="chip-estado ${claseEstado}">${estadoTexto}</span>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += cardHTML;
            });
        }

        // === 5. RELOJ Y ACTUALIZACIÓN ===
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('reloj-local').textContent = ahora.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        }, 1000);

        // Permitir sonido al primer clic (Política de navegadores web)
        document.body.addEventListener('click', () => {
            sonidoAlerta.load(); 
        }, { once: true });

        cargarDatos();
        // Verifica actualizaciones cada 10 segundos para mayor dinamismo
        setInterval(cargarDatos, 10000); 

    </script>
</body>
</html>
